# Pôvodné banky AfroPlayer: gain (Ruby amp), rate, pan a mapovanie nôt.
# Globálne odchýlky HUMANIZE_DYNAMIC/PITCH sú v javafro.yaml v sekcii playback.
# gain pri note je relatívny násobiteľ banky (napr. 0.7 pre slabší d/t/s).
# Úspešný úder basového bubna pridá aj jeho zvonec; b hrá iba zvonec.
# pan používa web; Java momentálne prehráva mono.
