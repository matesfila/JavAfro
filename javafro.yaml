# Predvolené nastavenia aplikácie. Zmeny sa načítajú pri ďalšom spustení.
# Webová verzia ich prevezme pri npm run dev alebo npm run build.
playback:
  humanizeApplianceProbability: 100 # pravdepodobnosť použitia humanizácie na notu, 0–100 %
  defaultTrackVolume: 70 # predvolená hlasitosť každého tracku v mixeri, 0–100 %
  humanize: 21 # 0–100; po štarte sa dá meniť posuvníkom
  humanizeMaxOffsetMs: 30 # maximálny posun ±ms pri humanize 100; 0 vypne časové odchýlky
  # Pôvodné globálne HUMANIZE_DYNAMIC a HUMANIZE_PITCH z AfroPlayera.
  humanizeDynamic: 0.07 # ku gain banky sa pridá ±(hodnota × humanize / 100), nie percento z gain
  humanizePitch: 0.005 # k rate banky sa pridá ±(hodnota × humanize / 100); mení ladenie aj dĺžku
  # Odchýlky sa vyberú nezávisle raz na hlas a počas doznievania sa nemenia.
  # Pri humanize 0 sú vypnuté; výber samplu a probability ostávajú aktívne.
  tempo:
    initial: 116 # globálne BPM pre rytmus bez bpm; explicitné bpm v rytme má prednosť
    minimum: 30
    maximum: 200 # rozsah posuvníka sa rozšíri, ak má rytmus BPM mimo neho

library:
  directory: rhythms # relatívne voči tomuto konfiguračnému súboru
  initialRhythm: basicRhythms.yaml # prvý rytmus vo webovej verzii

editor:
  fontSize: 18

window: # iba Java aplikácia; na malej obrazovke sa veľkosť prispôsobí
  width: 1200
  height: 900
