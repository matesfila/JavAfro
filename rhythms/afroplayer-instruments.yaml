# Djole from AfroPlayer Djole.rb, converted to track-specific notes and paired into 4/4 bars.
DjoleOriginal:
  bpm: 125
  stepsPerBeat: 4
  tracks:
    djembe: "Byoo..SyB.oopyS."
    djembe2: "B.SSB.ooB.SSB.oo"
    dundun: "D.x.x.x.D.D.x.x."
    sangban: "S.x.S.x.S.x.S.x."
    kenken: "x.KKx.KKx.KKx.KK"

# D/d (dundun), S/s (sangban), K/k (kensereni) = open drum + bell; i/I = closed drum + bell; x = bell only.
OpenClosedAndBell:
  bpm: 100
  stepsPerBeat: 4
  tracks:
    dundun: "D...i...x...I..."
    sangban: "S...i...x...I..."
    kensereni: "K...i...x...I..."

SeparateBells:
  bpm: 100
  stepsPerBeat: 4
  tracks:
    dundun_bell: "x...x...x...x..."
    sangban_bell: "..x...x...x...x."
    kensereni_bell: ".x...x...x...x.."

# A/B/C = open drum + bell with probabilities 12/40/80 percent.
Probabilities:
  bpm: 100
  stepsPerBeat: 4
  tracks:
    dundun: "D...A...B...C..."
    djembe2: "B.E.F.o.p.q.S.yz"
