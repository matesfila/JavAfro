# Original Djole symbols from AfroPlayer Djole.rb, paired into 4/4 bars.
DjoleOriginal:
  bpm: 125
  stepsPerBeat: 4
  tracks:
    djembe: "Dyoo..xyD.oopyx."
    djembe2: "D.xxD.ooD.xxD.oo"
    dundun: "X.b.b.b.X.X.b.b."
    sangban: "X.b.X.b.X.b.X.b."
    kenken: "b.XXb.XXb.XXb.XX"

# X/x = open drum + bell; i/I = closed drum + bell; b = bell only.
OpenClosedAndBell:
  bpm: 100
  stepsPerBeat: 4
  tracks:
    dundun: "X...i...b...I..."
    sangban: "X...i...b...I..."
    kensereni: "X...i...b...I..."

SeparateBells:
  bpm: 100
  stepsPerBeat: 4
  tracks:
    dundun_bell: "x...b...x...b..."
    sangban_bell: "..x...b...x...b."
    kensereni_bell: ".x...b...x...b.."

# A/B/C = open drum + bell with probabilities 12/40/80 percent.
Probabilities:
  bpm: 100
  stepsPerBeat: 4
  tracks:
    dundun: "X...A...B...C..."
    djembe2: "D.E.F.o.p.q.x.yz"
