djembe-demo:
  bpm: 100
  timeSignature: "4/4"
  stepsPerBeat: 4
  dialect: [0, 0, 0, 0]

  tracks:
    dundun:    "D.......D......."
    sangban:   "....S.......S..."
    kensereni: "..K...K...K...K."
    djembe:
      # b = bas, t = tón, s = slap; veľké písmená sú akcenty.
      base: "b..t.s..B.tt.S.."
      variations:
        # i = tlmený tón, c = tlmený slap, a = alternatívny slap.
        - "B.tsI.c.a.T.s..."
        # Prevedené značky AfroPlayer: B/o/S/i, E/p/y (60 %), F/q/z (12 %).
        - "B.oSE.pyF.qz.i.."
